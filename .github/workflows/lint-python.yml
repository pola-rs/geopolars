name: Lint Python

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: --version
      - run: ruff check --no-fix
      - run: ruff format --diff
