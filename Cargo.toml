[workspace]
resolver = "2"
members = ["geopolars", "geopolars-views", "geopolars-compute", "geopolars-core"]
# The polars checkout for Python polars is its own workspace, not part of ours.
exclude = [".polars"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Keep every polars-* crate on the SAME minor version. Mixing them (e.g. polars
# 0.55 with polars-plan 0.54) compiles into two incompatible copies of the core
# types and fails with confusing trait errors.
polars = { version = "0.55", default-features = false }
polars-core = { version = "0.55", default-features = false }
polars-arrow = { version = "0.55", default-features = false }
# Where polars-arrow's `Buffer` lives. It is not re-exported.
polars-buffer = { version = "0.55", default-features = false }

# pyo3-polars is versioned INDEPENDENTLY of polars. 0.28 is the release built
# against polars 0.55 / pyo3 0.29. Bump all three together, never one alone.
pyo3-polars = { version = "0.28" }
pyo3 = { version = "0.29" }

serde = { version = "1.0.188", features = ["derive", "rc"] }

# Full debuginfo for all of polars statically linked into one cdylib produces an
# ~800MB artifact. Line tables are enough for backtraces and keep it sane.
[profile.dev]
debug = "line-tables-only"

# A plugin is a cdylib loaded into the polars process: build it optimized or the
# FFI hop costs more than the work it does.
[profile.release]
lto = "thin"
codegen-units = 1

# We build against a specific polars commit.
# The Makefile reads `rev` from here and checks out the same commit into .polars to build Python polars.
# Using a a git source rather than a path into .polars, 
# because cargo only hides # warnings from dependencies that are not path dependencies.
# Be sure to keep them all the same!
[patch.crates-io]
polars = { git = "https://github.com/pola-rs/polars", rev = "8a87616112e5c5ee8b862c675bed3cbaa1e202db" }
polars-arrow = { git = "https://github.com/pola-rs/polars", rev = "8a87616112e5c5ee8b862c675bed3cbaa1e202db" }
polars-buffer = { git = "https://github.com/pola-rs/polars", rev = "8a87616112e5c5ee8b862c675bed3cbaa1e202db" }
polars-core = { git = "https://github.com/pola-rs/polars", rev = "8a87616112e5c5ee8b862c675bed3cbaa1e202db" }
polars-ffi = { git = "https://github.com/pola-rs/polars", rev = "8a87616112e5c5ee8b862c675bed3cbaa1e202db" }
polars-lazy = { git = "https://github.com/pola-rs/polars", rev = "8a87616112e5c5ee8b862c675bed3cbaa1e202db" }
polars-plan = { git = "https://github.com/pola-rs/polars", rev = "8a87616112e5c5ee8b862c675bed3cbaa1e202db" }
polars-utils = { git = "https://github.com/pola-rs/polars", rev = "8a87616112e5c5ee8b862c675bed3cbaa1e202db" }
pyo3-polars = { git = "https://github.com/pola-rs/polars", rev = "8a87616112e5c5ee8b862c675bed3cbaa1e202db" }
pyo3-polars-derive = { git = "https://github.com/pola-rs/polars", rev = "8a87616112e5c5ee8b862c675bed3cbaa1e202db" }
