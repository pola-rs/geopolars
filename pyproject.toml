[project]
name = "geopolars-dev"
version = "0.0.0"
description = "Dev environment for the geopolars polars plugin"
requires-python = ">=3.10"
dependencies = [
    "geopandas>=1.1.4",
    "geopolars",
    "maturin>=1.12.4",
    "polars>=2.0.0rc2",
    # uv ignores sources for transitive dependencies,
    # but polars pulls this in.
    "polars-runtime-32",
    "pyarrow>=25.0.1",
    "ruff>=0.16.10",
]

[tool.uv]
# The root is a "virtual" project: it exists to pin the dev environment, and is
# never built or published itself.
package = false

# Mirrors the Python members of the [workspace] in the root Cargo.toml.
[tool.uv.workspace]
members = ["geopolars"]

# Resolve geopolars from the workspace instead of PyPI. uv installs
# workspace members editable by default, which is what puts the compiled
# cdylib next to the Python sources where `plugin_path=LIB` expects it.
[tool.uv.sources]
geopolars = { workspace = true }
polars = { path = ".polars/py-polars" }
polars-runtime-32 = { path = ".polars/py-polars/runtime/polars-runtime-32" }

[tool.ruff]
# resolve first-party imports (`geopolars`, `tests`) from here
src = ["geopolars"]
# the docs' fenced blocks hold snippet includes (`--8<--`), not Python
extend-exclude = ["*.md"]

[dependency-groups]
dev = [
    # Pinned: https://github.com/PyO3/maturin/issues/3106
    "maturin>=1.0,<=1.12.4",
    # Test suite. Tooling is pinned loosely; the tests themselves must keep
    # passing against the latest polars, so polars is not pinned here.
    "pytest>=8.0",
    "pytest-xdist>=3.5",
]
docs = [
    "numpydoc>=1.8",
    "pydata-sphinx-theme>=0.16",
    "sphinx>=8.1",
    "sphinx-autosummary-accessors>=2023.4",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
]
