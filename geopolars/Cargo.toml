[package]
name = "geopolars"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "geopolars"
# cdylib only: polars dlopen's this file, it is never linked as a Rust lib.
crate-type = ["cdylib"]

[features]
default = ["extension-module"]
# This is put behind a feature flag so we can `cargo test --no-default-features`.
# extension-module controls linking to libpython, which breaks rust testing.
extension-module = ["pyo3/extension-module"]

[dependencies]
polars = { workspace = true, features = [
  "allow_unused",
  "dtype-extension",
  "dtype-struct",
] }
polars-core = { workspace = true, features = ["dtype-extension", "dtype-struct"] }
# The array types under a Series. polars does not re-export them publicly.
polars-arrow = { workspace = true }

pyo3-polars = { workspace = true, features = ["derive"] }
# abi3-py310: one wheel for 3.10+, matching polars' own requires-python.
# extension-module is behind the default feature below, not set here.
pyo3 = { workspace = true, features = ["abi3-py310"] }

serde = { workspace = true, features = ["derive"] }
geo-traits = "0.3.0"
# Bundled with the plugin rather than using the system installation (portability).
proj = { version = "0.31", features = ["bundled_proj"] }
# The C API under `proj`.
# Used for what it does not expose (e.g. a CRS's ellipsoid).
# Must match the version `proj` pins, so both link the same bundled PROJ.
proj-sys = "0.27"
geoarrow-schema = "0.9.0"
# Views over the GeoArrow storage, `Kind`, and `GeoDimension`.
geopolars-views = { path = "../geopolars-views" }
# The kernels on those views.
geopolars-compute = { path = "../geopolars-compute" }
# Picks the kernel for each kind of geometry.
geopolars-core = { path = "../geopolars-core" }
# WKB encoding and decoding, through geo-traits.
# Keep on the version geoarrow-array pins.
wkb = "0.9.2"
# WKT encoding and decoding, through geo-traits.
# Keep on the version geoarrow-array pins.
wkt = { version = "0.14.0", default-features = false }
# for maximum interoperability, we should not reshuffle keys when (re-)constructing metadata.
serde_json = { version = "1", features = ["preserve_order"] }
# Keeps a GeoParquet file's geometry columns in schema order, for the same reason.
indexmap = { version = "2", features = ["serde"] }
