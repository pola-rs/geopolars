[build-system]
# Pinned: https://github.com/PyO3/maturin/issues/3106
requires = ["maturin>=1.0,<=1.12.4"]
build-backend = "maturin"

[project]
name = "geopolars"
description = "Geospatial data types and operations for Polars"
readme = "../README.md"
authors = [{ name = "Aida van de Wetering" }, { name = "GeoPolars contributors" }]
version = "0.2.0a1"
license = "MIT"
# A symlink to the root LICENSE, as license files cannot be outside the package directory.
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["dataframe", "geospatial", "gis", "geoarrow", "polars"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: GIS",
  "Typing :: Typed",
]
# The floor is 2.0.0rc2, but we build against a later commit (see the root Cargo.toml), and do not test against the floor.
dependencies = ["polars>=2.0.0rc2"]

[project.urls]
Repository = "https://github.com/pola-rs/geopolars"
Issues = "https://github.com/pola-rs/geopolars/issues"

[tool.maturin]
# Mixed layout: Python sources in geopolars/, Rust cdylib compiled in
# beside them, so that `plugin_path=LIB` finds it.
python-source = "."
module-name = "geopolars.geopolars"
# Keeps interpreter-specific .pyc files from local runs out of the abi3 wheel.
exclude = ["**/__pycache__/**", "tests/**"]

[tool.pytest.ini_options]
# Mirrors py-polars/pyproject.toml.
testpaths = ["tests"]
addopts = [
  "--tb=short",
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
  # Default to running fast tests only. To run ALL tests, run: pytest -m ""
  "-m not slow and not release and not benchmark",
]
markers = [
  "benchmark: Tests used to benchmark with.",
  "release: Tests that should be run on a geopolars release build.",
  "slow: Tests with a longer than average runtime.",
  "may_fail_lazy_schema: Test whose lazy queries may have a `collect_schema()` that disagrees with the schema of the collected DataFrame.",
  "parquet_xfail(*backends, reason): Strict xfail when the `parquet` fixture runs one of `backends`.",
]
filterwarnings = [
  # Fail on warnings.
  "error",
]
xfail_strict = true

[tool.uv]
# Without this, uv fingerprints only the Python metadata and will serve a stale
# .so after you edit Rust. These keys force a rebuild on Rust changes.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "../Cargo.toml" },
  { file = "../Cargo.lock" },
  { file = "src/**/*.rs" },
]
