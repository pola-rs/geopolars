[package]
name = "geopolars-compute"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["native", "geos", "rsgeo"]
# Kernels implemented directly on the Arrow representation.
native = []
# Kernels forwarding to GEOS.
geos = ["dep:geos"]
# Kernels forwarding to rsgeo.
rsgeo = ["dep:rsgeo"]

[dependencies]
# The views and output arrays the kernels are written against.
geopolars-views = { path = "../geopolars-views" }
polars-arrow = { workspace = true }
# PROJ, to bring coordinates to longitude/latitude for `GeodesicMetric`.
# geopolars turns on `bundled_proj`; must match the version geopolars pins.
proj = { version = "0.31", default-features = false, features = ["bundled_proj"] }
# The C API under `proj`, which can send z through PROJ.
# Must match the version `proj` pins, so both link the same bundled PROJ.
proj-sys = "0.27"
# For measuring along a CRS's ellipsoid.
# Keep on the version and features rsgeo pulls in.
geographiclib-rs = { version = "0.2.7", default-features = false }
geos = { version = "11.3.1", features = ["static", "v3_15_0"], optional = true }
# Named `rsgeo` so it cannot be confused with our own `geo`.
rsgeo = { package = "geo", version = "0.33.1", default-features = false, optional = true }
